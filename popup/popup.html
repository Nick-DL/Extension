<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班辅助插件</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
@font-face {
  font-family: 'Material Icons';
  font-style: normal;
  font-weight: 400;
  src: url('../icons/MaterialIcons-Regular.woff2') format('woff2');
}
.material-icons {
  font-family: 'Material Icons';
  font-weight: normal;
  font-style: normal;
  display: inline-block;
  line-height: 1;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: normal;
  white-space: nowrap;
  font-size:14px;
  direction: ltr;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'liga';
}
</style>
<style>
:root {
  --primary: #006A69;
  --danger: #ff4d4f;
  --success: #52c41a;
  --warning: #faad14;
  --bg: #fff;
  --text: #333;
  --text-secondary: #666;
  --border: #d9d9d9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 320px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
}
.header {
  background: var(--primary);
  color: #fff;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header h1 { font-size: 15px; font-weight: 600; }
.header .icon { font-size: 20px; }
.content { padding: 12px 16px; }
.section {
  margin-bottom: 14px;
  padding: 12px;
  border-radius: 8px;
  background: #fafafa;
  border: 1px solid #f0f0f0;
}
.section-title {
  font-weight: 600;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
/* 开关 */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.toggle-label {
  font-size: 13px;
  font-weight: 500;
}
.toggle-switch {
  position: relative;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
}
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 24px;
  cursor: pointer;
  transition: all .3s;
}
.toggle-slider:before {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  left: 3px; bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: all .3s;
}
input:checked + .toggle-slider { background: var(--success); }
input:checked + .toggle-slider:before { transform: translateX(20px); }
/* 信息 */
.status-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  padding: 6px 10px;
  border-radius: 6px;
  margin-top: 6px;
}
.status-bar.active { background: #f6ffed; color: var(--success); border: 1px solid #b7eb8f; }
.status-bar.inactive { background: #fff7e6; color: var(--warning); border: 1px solid #ffe58f; }
.status-bar.disabled { background: #f5f5f5; color: #999; border: 1px solid #d9d9d9; }
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-dot.active { background: var(--success); }
.status-dot.inactive { background: var(--warning); }
.status-dot.disabled { background: #ccc; }
/* 按钮 */
.btn {
  display: block;
  width: 100%;
  padding: 8px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  transition: all .2s;
  text-align: center;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #00857D; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #ff7875; }
.btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
.btn-outline:hover { background: #E0F2F1; }
.btn-group { display: flex; gap: 6px; }
.btn-group .btn { flex: 1; }
/* 信息行 */
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  padding: 4px 0;
}
.info-row .label { color: var(--text-secondary); }
.info-row .value { font-weight: 500; }
.divider { border: none; border-top: 1px solid #f0f0f0; margin: 10px 0; }
.footer { padding: 8px 16px; border-top: 1px solid #f0f0f0; font-size: 10px; color: #bbb; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <img src="../icons/icon.svg" class="icon" style="width:20px;height:20px;border:1px solid #fff;border-radius:2px;">
  <h1>排班辅助插件</h1>
</div>

<div class="content">
  <!-- 启用开关 -->
  <div class="section">
    <div class="section-title"><span class="material-icons">settings</span> 页面控制</div>
    <div class="toggle-row">
      <span class="toggle-label">为本页面启用辅助插件</span>
      <label class="toggle-switch">
        <input type="checkbox" id="enableToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="status-bar disabled" id="statusBar">
      <span class="status-dot disabled"></span>
      <span id="statusText">未启用</span>
    </div>
  </div>

  <!-- 当前状态 -->
  <div class="section" id="infoSection" style="display:none;">
    <div class="section-title"><span class="material-icons">bar_chart</span> 当前工作周</div>
    <div id="weekInfo">
      <div class="info-row"><span class="label">年份</span><span class="value" id="infoYear">--</span></div>
      <div class="info-row"><span class="label">周序</span><span class="value" id="infoWeek">--</span></div>
      <div class="info-row"><span class="label">周一日期</span><span class="value" id="infoMonday">--</span></div>
    </div>
    <div class="section-title" style="margin-top:8px;"><span class="material-icons">group</span> 人员信息</div>
    <div id="empInfo">
      <div class="info-row"><span class="label">医生数</span><span class="value" id="infoDocCount">--</span></div>
      <div class="info-row"><span class="label">规培生数</span><span class="value" id="infoTraineeCount">--</span></div>
      <div class="info-row"><span class="label">班型数</span><span class="value" id="infoClassCount">--</span></div>
    </div>
  </div>

  <!-- 操作 -->
  <div class="section" id="actionSection" style="display:none;">
    <div class="section-title"><span class="material-icons">build</span> 操作</div>
    <div class="btn-group">
      <button class="btn btn-outline" id="btnRefreshData"><span class="material-icons">refresh</span> 刷新数据</button>
      <button class="btn btn-outline" id="btnRestoreData"><span class="material-icons">undo</span> 恢复备份</button>
    </div>
    <button class="btn btn-primary" style="margin-top:6px;" id="btnOpenPanel">
      <span class="material-icons">assignment</span> 打开排班面板
    </button>
  </div>

  <!-- 测试模式 -->
  <div class="section">
    <div class="section-title"><span class="material-icons">science</span> 测试模式</div>
    <div class="toggle-row">
      <span class="toggle-label">允许在非正式页面运行</span>
      <label class="toggle-switch">
        <input type="checkbox" id="testModeToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <input type="text" id="testUrlInput" placeholder="输入测试页面URL匹配模式..." style="width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:11px;margin-top:6px;">
    <button class="btn btn-outline" style="margin-top:6px;" id="btnAddTestPattern"><span class="material-icons">add</span> 添加测试页面</button>
  </div>
</div>

<div class="footer">
  绵阳市第三人民医院 · 排班辅助 <span id="footerVersion">v1.0</span>
</div>

<script src="popup.js"></script>
</body>
</html>
